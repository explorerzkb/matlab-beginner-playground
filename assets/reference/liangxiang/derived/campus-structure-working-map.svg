<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
  <title id="title">北京理工大学良乡校区空间结构工作图</title>
  <desc id="desc">北向上、非等比例，按地图近似摆放北区和南区主要组团，供二维横版游戏关卡规划使用。</desc>
  <defs>
    <style>
      .text { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .zone { stroke: #39566f; stroke-width: 2.5; rx: 18; ry: 18; }
      .title { font-size: 24px; font-weight: 750; }
      .sub { font-size: 16px; fill: #4b6070; }
      .verified { stroke: #2f6e5a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .candidate { stroke: #c26a2e; stroke-width: 4; stroke-dasharray: 11 10; fill: none; marker-end: url(#arrowOrange); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f6e5a"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c26a2e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#163044" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1150" fill="#f7f5ef"/>
  <text x="70" y="60" class="text" font-size="36" font-weight="800">良乡校区空间结构工作图</text>
  <text x="70" y="94" class="text sub">北向上 · 非等比例 · 方位与组团来自多张地图，箭头表示关系而非导航路线</text>
  <g transform="translate(1460 40)">
    <path d="M0 48 L20 0 L40 48 Z" fill="#2f6e5a"/>
    <text x="20" y="75" text-anchor="middle" class="text title">北</text>
  </g>

  <rect x="55" y="125" width="1490" height="585" rx="28" fill="#e8f3e8" stroke="#8aad8e" stroke-width="3"/>
  <text x="85" y="165" class="text" font-size="23" font-weight="800">北区：位置按北向上近似排列</text>

  <g filter="url(#shadow)">
    <rect class="zone" x="95" y="190" width="500" height="95" fill="#f3dfee"/>
    <text x="345" y="230" text-anchor="middle" class="text title">丹枫园 · 劲松园</text>
    <text x="345" y="260" text-anchor="middle" class="text sub">北侧宿舍带与篮球区域</text>

    <rect class="zone" x="95" y="325" width="500" height="205" fill="#d8eef0"/>
    <text x="345" y="378" text-anchor="middle" class="text title">北湖</text>
    <text x="345" y="410" text-anchor="middle" class="text sub">白桥亭廊 · 北湖红桥 · 生态岛 · 思源榭</text>
    <text x="345" y="440" text-anchor="middle" class="text sub">局部结构另见北湖拓扑图</text>
    <path d="M155 485 C230 425 310 520 390 465 S520 435 555 480" stroke="#5aa6ad" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.75"/>

    <rect class="zone" x="95" y="565" width="500" height="110" fill="#f5e4dc"/>
    <text x="345" y="605" text-anchor="middle" class="text title">静园 · 校医院 · 学生服务 · 北／清真食堂</text>
    <text x="345" y="640" text-anchor="middle" class="text sub">北湖西南侧生活与公共服务组团</text>

    <rect class="zone" x="650" y="190" width="275" height="110" fill="#f3dfee"/>
    <text x="788" y="232" text-anchor="middle" class="text title">甘棠园 · 东食堂</text>
    <text x="788" y="265" text-anchor="middle" class="text sub">勤园西侧入口参照</text>

    <rect class="zone" x="970" y="190" width="250" height="110" fill="#f6e6cb"/>
    <text x="1095" y="232" text-anchor="middle" class="text title">勤园</text>
    <text x="1095" y="265" text-anchor="middle" class="text sub">道路 · 下沉球场 · 扶梯</text>

    <rect class="zone" x="650" y="365" width="300" height="205" fill="#dfe7f4"/>
    <text x="800" y="415" text-anchor="middle" class="text title">综教 · 行政楼</text>
    <text x="800" y="450" text-anchor="middle" class="text title">徐特立图书馆</text>
    <text x="800" y="500" text-anchor="middle" class="text sub">北湖南侧至东南侧</text>
    <text x="800" y="530" text-anchor="middle" class="text sub">教学与公共服务组团</text>

    <rect class="zone" x="990" y="365" width="235" height="205" fill="#dae6f4"/>
    <text x="1108" y="425" text-anchor="middle" class="text title">文萃楼群</text>
    <text x="1108" y="462" text-anchor="middle" class="text sub">A—M 多栋连接</text>
    <text x="1108" y="494" text-anchor="middle" class="text sub">不是单栋通用楼</text>

    <rect class="zone" x="1270" y="190" width="235" height="135" fill="#ece4d8"/>
    <text x="1388" y="237" text-anchor="middle" class="text title">文化与博物馆中心</text>
    <text x="1388" y="273" text-anchor="middle" class="text sub">文体中心北邻</text>

    <rect class="zone" x="1270" y="365" width="235" height="205" fill="#e8dfd4"/>
    <text x="1388" y="410" text-anchor="middle" class="text title">文体中心</text>
    <text x="1388" y="445" text-anchor="middle" class="text title">国防文化广场</text>
    <text x="1388" y="480" text-anchor="middle" class="text title">体育馆一带</text>
    <text x="1388" y="525" text-anchor="middle" class="text sub">广场贴建筑前场</text>
  </g>

  <path class="verified" d="M345 287 L345 320"/>
  <path class="verified" d="M927 245 L965 245"/>
  <path class="verified" d="M952 465 L985 465"/>
  <path class="verified" d="M1227 465 L1265 465"/>
  <path class="verified" d="M1388 327 L1388 360"/>
  <path class="candidate" d="M590 480 C620 500 622 520 648 525"/>

  <rect x="55" y="730" width="1490" height="88" rx="18" fill="#ead8a5" stroke="#a47b2d" stroke-width="3"/>
  <text x="800" y="770" text-anchor="middle" class="text" font-size="25" font-weight="800">良乡东路：北区／南区的明确结构边界</text>
  <text x="800" y="802" text-anchor="middle" class="text sub">跨区时表现道路、北理桥或章节转场；不能把北湖和南区教学楼当作一步之遥</text>

  <rect x="55" y="840" width="1490" height="220" rx="28" fill="#e9eff7" stroke="#8ea7c3" stroke-width="3"/>
  <text x="85" y="880" class="text" font-size="23" font-weight="800">南区</text>
  <g filter="url(#shadow)">
    <rect class="zone" x="95" y="915" width="430" height="105" fill="#f2dfee"/>
    <text x="310" y="956" text-anchor="middle" class="text title">疏桐园 · 运动场 · 南食堂 · 博雅园</text>
    <text x="310" y="990" text-anchor="middle" class="text sub">南区西侧生活与运动组团</text>

    <rect class="zone" x="585" y="915" width="450" height="105" fill="#dce8f5"/>
    <text x="810" y="956" text-anchor="middle" class="text title">理教 · 物理 · 化学 · 工业生态</text>
    <text x="810" y="990" text-anchor="middle" class="text sub">南区中部教学科研组团</text>

    <rect class="zone" x="1095" y="915" width="410" height="105" fill="#e3e1f3"/>
    <text x="1300" y="956" text-anchor="middle" class="text title">融创／信创 · 工程训练</text>
    <text x="1300" y="990" text-anchor="middle" class="text sub">南区东侧创新科研组团</text>
  </g>
  <path class="verified" d="M527 968 L580 968"/>
  <path class="verified" d="M1037 968 L1090 968"/>

  <g transform="translate(80 1100)">
    <line x1="0" y1="0" x2="55" y2="0" class="verified"/>
    <text x="70" y="6" class="text sub">地图或同框证据支持的关系</text>
    <line x1="350" y1="0" x2="405" y2="0" class="candidate"/>
    <text x="420" y="6" class="text sub">候选关卡转场，不代表地理未知</text>
    <text x="825" y="6" class="text sub" font-weight="700">注意：游戏一直向右推进，不等于现实一直向东。</text>
  </g>
</svg>
